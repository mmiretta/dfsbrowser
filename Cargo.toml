[package]
name         = "dfs-browser"
version      = "0.1.0"
edition      = "2021"
description  = "Web UI to browse a DFS filesystem straight from its S3 backend"
license      = "MIT"
repository   = "https://github.com/mmiretta/dfsbrowser"
readme       = "README.md"
keywords     = ["dfs", "s3", "filesystem", "browser", "web"]
categories   = ["filesystem", "web-programming"]
default-run  = "dfs-browser"

[[bin]]
name = "dfs-browser"
path = "src/main.rs"

# Writes a small synthetic DFS volume into an S3 bucket (used by the demo profile).
[[bin]]
name = "dfs-browser-demo-seed"
path = "src/bin/demo_seed.rs"

[dependencies]
# DFS on-disk/S3 formats (inodes, snapshots, chunk encryption, erasure coding).
dfs-daemon         = { git = "https://github.com/mmiretta/dfs.git", rev = "2a2b3baef05f48c1afb80129948d3bcc866d8baf" }
actix-web          = "4"
tokio              = { version = "1", features = ["full"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
uuid               = { version = "1", features = ["v4", "v7", "serde"] }
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd               = "0.13"
rmp-serde          = "1"
sha2               = "0.10"
dashmap            = "6"
rand               = "0.8"
base64             = "0.22"
futures-util       = "0.3"
mime_guess         = "2"
hex                = "0.4"

[profile.release]
strip = true
lto   = "thin"
